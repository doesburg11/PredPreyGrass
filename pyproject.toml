[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predpreygrass"
version = "0.1"
description = "A multi-agent reinforcement learning environment with predators, prey, and grass."
authors = [
    { name = "Peter van Doesburg", email = "petervandoesburg11@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",  # install via requirements.txt or with --extra-index-url https://download.pytorch.org/whl/cu132 (needs NVIDIA driver >=595.45.04)
    "ray[rllib]==2.59.0",
    "tensorboard==2.20.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "Pillow>=10.0.0",
    "matplotlib==3.10.1",
    "opencv-python==4.11.0.86",
    "pygame==2.6.1",
    "gymnasium==1.2.2",
    "pandas==2.2.3",
    "requests>=2.30"  # older requests caps urllib3<2 and makes pip downgrade it
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ipykernel",
    "jupyter",
    "mypy",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["predpreygrass*"]

[tool.pytest.ini_options]
testpaths = ["predpreygrass"]
norecursedirs = ["runs", "ray_results*", "source_code", ".*", "__pycache__"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E203"]
