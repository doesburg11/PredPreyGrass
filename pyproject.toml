[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predpreygrass"
version = "0.1"
description = "A multi-agent reinforcement learning environment with predators, prey, and grass."
authors = [
    { name = "Peter van Doesburg", email = "petervandoesburg11@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.13.0",  # install via requirements.txt or with --extra-index-url https://download.pytorch.org/whl/cu132 (needs NVIDIA driver >=595.45.04)
    "ray[rllib]==2.58.0",
    "tensorboard==2.20.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "Pillow>=10.0.0",
    "imageio>=2.34.0",
    "matplotlib==3.10.1",
    "opencv-python==4.11.0.86",
    "pygame==2.6.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ipykernel",
    "jupyter",
    "mypy",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["predpreygrass*"]

[tool.pytest.ini_options]
testpaths = ["predpreygrass/evolutionary/eco_evolutionary_investment/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E203"]
